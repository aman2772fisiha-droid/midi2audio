[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "midi2audio"
version = "0.1.0"
description = "Deterministic MIDI analysis pipeline"
requires-python = ">=3.10"
dependencies = [
    "mido>=1.3",
    "pydantic>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
